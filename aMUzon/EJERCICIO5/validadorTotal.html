    :root {
      color-scheme: dark;

      color: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0, rgba(0, 243, 255, .09), transparent 42%),
        linear-gradient(rgba(255, 255, 255, .015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .015) 1px, transparent 1px), #060913;
      background-size: auto, 32px 32px, 32px 32px;
    }
    .shell { max-width: 1540px; margin: auto; padding: 1.25rem; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1.4rem 1.6rem; border: 1px solid rgba(0, 243, 255, .2);
      border-radius: 14px; background: rgba(10, 20, 38, .86);
      backdrop-filter: blur(12px);
    }
    .eyebrow { color: #00f3ff; font-size: .73rem; font-weight: 700; letter-spacing: .14em; margin: 0 0 .4rem; }
    h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
    .subtitle { color: #94a3b8; margin: .4rem 0 0; }
    .status { color: #10b981; font-size: .75rem; font-weight: 700; white-space: nowrap; }
    .status::before { content: ""; display: inline-block; width: .55rem; height: .55rem; margin-right: .5rem; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .tabs { display: flex; gap: .6rem; overflow-x: auto; padding: 1rem 0; }
    .tab {
      flex: 1 0 120px; padding: .8rem 1rem; border: 1px solid rgba(0, 243, 255, .2);
      border-radius: 9px; background: rgba(12, 24, 42, .85); color: #cbd5e1;
      font: inherit; font-weight: 700; cursor: pointer; transition: background .2s, border-color .2s, color .2s;
    }
    .tab:hover, .tab[aria-selected="true"] { border-color: #00f3ff; color: #00f3ff; background: rgba(0, 243, 255, .12); }
    .tab:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
    .validator-panel[hidden] { display: none; }
    .viewer { border: 1px solid rgba(0, 243, 255, .2); border-radius: 14px; overflow: hidden; background: #060913; }
    .validator-frame { display: block; width: 100%; height: max(75vh, 680px); border: 0; background: #060913; }
    .validator-frame[hidden] { display: none; }
    .error { color: #fca5a5; margin: 1rem; }
    .footer { margin: .8rem .2rem; color: #94a3b8; font-size: .78rem; }
    @media (max-width: 600px) {
      .shell { padding: .65rem; }
      .topbar { align-items: flex-start; flex-direction: column; padding: 1rem; }
      .tab { flex-basis: 110px; }
    }
  </style>
</head>
<body>

      <div class="validator-panel" id="validator-3" role="tabpanel" aria-labelledby="tab-3" hidden></div>
      <div class="validator-panel" id="validator-4" role="tabpanel" aria-labelledby="tab-4" hidden></div>

    :host {

    * {

    .container {

      padding: 0 1.5rem;

    /* Glass Cards */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 14px;
      backdrop-filter: blur(14px);

    .card-title {
      font-size: 1.4rem;

      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;

    .form-group {
      display: flex;
      flex-direction: column;
    }

      grid-column: 1 / -1;

    .form-label {

      line-height: 1.45;

    .status-banner.invalid {

    .status-icon {
      font-size: 1.8rem;
      margin-right: 0.6rem;
    }

    /* Metrics Dashboard Grid */
    .metrics-grid {

      margin-bottom: 2rem;

    .metric-card {
      background: var(--bg-panel);

    .badge-green { background: rgba(16, 185, 129, 0.2); color: var(--green); }
    .badge-cyan { background: rgba(0, 243, 255, 0.2); color: var(--cyan); }
    .badge-orange { background: rgba(245, 158, 11, 0.2); color: var(--orange); }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--red); }

    /* Hash Comparison Inspector */
    .hash-inspector {

    .hash-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hash-val {
      word-break: break-all;

    }

    /* Answers Breakdown Table */
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;

    }

    .audit-table th {
      background: rgba(0, 0, 0, 0.5);
      padding: 0.8rem;
      color: var(--cyan);
      border-bottom: 1px solid var(--border-neon);
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    .audit-table td {
      padding: 0.85rem 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      vertical-align: top;
    }

    .audit-table tr:hover {
      background: rgba(0, 243, 255, 0.03);
    }

    .audit-table tr.row-correct {
      border-left: 3px solid var(--green);
    }

    .audit-table tr.row-wrong {
      border-left: 3px solid var(--red);
    }

    /* Actions bar */
    .actions-bar {
      display: flex;
      gap: 1rem;
      margin-top: 1.8rem;
    }

    .toast-msg {
      color: var(--green);
      font-size: 0.85rem;
      margin-left: auto;
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .toast-msg.show {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
      .actions-bar { flex-direction: column; }
    }
  
</style>

<script>
(() => {
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  tabs.forEach((tab, index) => {
    const panel = document.getElementById(`validator-${index + 1}`);
    panel.attachShadow({ mode: 'open' }).appendChild(document.getElementById(`template-${index + 1}`).content.cloneNode(true));
  });
  function select(index, focus) {
    tabs.forEach((tab, i) => {
      const selected = i === index;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      document.getElementById(`validator-${i + 1}`).hidden = !selected;
    });
    document.getElementById('current-label').textContent = `Juego ${index + 1} · EJERCICIO${index + 1}`;
    if (focus) tabs[index].focus();
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => select(index, false));
    tab.addEventListener('keydown', event => {
      let next;
      if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
      else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = tabs.length - 1;
      else return;
      event.preventDefault();
      select(next, true);
    });
  });
})();
</script>

    /**
     * ========================================================================
     * PRNG & DETERMINISTIC SHUFFLE (IDENTICAL TO INDEX.HTML)
     * ========================================================================
     */
    function createPRNG(seedNumber) {
      let s = Math.floor(Math.abs(seedNumber)) || 9182;
      return function() {
        s |= 0;
        s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function deterministicShuffle(array, rng) {
      if (!Array.isArray(array) || array.length <= 1) return [...array];
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    /**
     * ========================================================================
     * SHA-256 HASH COMPUTATION (SubtleCrypto with Pure JS fallback)
     * ========================================================================
     */
    function utf8Encode(str) {
      return unescape(encodeURIComponent(str));
    }

    function sha256Pure(ascii) {
      ascii = utf8Encode(ascii);
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j, result = '', words = [];
      var asciiBitLength = ascii[lengthProperty] * 8, hash = [], k = [], primeCounter = 0, isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i % 4) * 8);
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength | 0);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
          var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
          var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
          var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
          var temp1 = (hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0)) | 0;
          var temp2 = ((rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj) | 0;
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
          hash.length = 8;
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j >= 0; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result.toUpperCase();
    }

    async function computeSHA256(message) {
      try {
        if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
          const msgBuffer = new TextEncoder().encode(message);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }
      } catch (e) {}
      return sha256Pure(message);
    }

    /**
     * ========================================================================
     * PARSE CVHC TOKEN AUTOMATICALLY
     * ========================================================================
     */
    function parseCVHCToken(tokenString) {
      if (!tokenString || typeof tokenString !== 'string') return null;
      const clean = tokenString.trim();
      // Regex matches: AMZ-Q2-2026-S[Seed]-P[Score]-T[Time]-A[AnswersCode]-[Hash]
      // Also handles format without -A, e.g. AMZ-Q2-2026-S9182-P980-T380-4B1C7F9D
      const match = clean.match(/^AMZ-Q2-2026-S(\d+)-P(\d+)-T(\d+)(?:-A([0-9A-Za-z]+))?-([A-Fa-f0-9]+)$/i);
      if (match) {
        return {
          seed: parseInt(match[1], 10),
          score: parseInt(match[2], 10),
          time: parseInt(match[3], 10),
          answersCode: match[4] || '',
          hash: match[5].toUpperCase()
        };
      }
      return null;
    }

function sha256Pure(ascii) {

        words[i >> 2] |= j << ((3 - i % 4) * 8);

            )) | 0;

async function computeSHA256(message) {

function reconstructChallengesAudit(seed, answersEncoded, claimedScore) {
    const list = document.getElementById('audit-breakdown-list');
    list.innerHTML = '';

    const answersArray = answersEncoded ? answersEncoded.split('').map(c => parseInt(c, 10)) : [];

    CHALLENGES.forEach((challenge, idx) => {
        // Deterministic PRNG with student seed
        const challengeRng = createPRNG(seed + idx * 101);
        const shuffled = shuffleOptions(challenge.options, challengeRng);

        // Find correct option index in shuffled
        const correctIndex = shuffled.findIndex(opt => opt.correct);
        const correctOption = shuffled[correctIndex];

        // Did student provide answer for this?
        let studentSelectedIndex = -1;
        let isCorrect = false;
        let selectedOption = null;

        if (answersArray.length > idx && !isNaN(answersArray[idx])) {
            studentSelectedIndex = answersArray[idx];
            if (studentSelectedIndex >= 0 && studentSelectedIndex < shuffled.length) {
                selectedOption = shuffled[studentSelectedIndex];
                isCorrect = selectedOption.correct;
            }
        } else {
            // If answer string was not provided in CVHC, mark based on challenge accuracy
            isCorrect = (idx < Math.round(claimedScore / 100));
            selectedOption = isCorrect ? correctOption : shuffled.find(opt => !opt.correct);
        }

        const letters = ['A', 'B', 'C', 'D'];
        const letterChosen = studentSelectedIndex >= 0 ? (letters[studentSelectedIndex] || studentSelectedIndex + 1) : '-';
        const letterCorrect = letters[correctIndex] || (correctIndex + 1);

        const item = document.createElement('div');
        item.className = `breakdown-item ${isCorrect ? 'correct' : 'incorrect'}`;

        item.innerHTML = `
            <div class="breakdown-header">
                <span class="breakdown-ra">${escapeHTML(challenge.ra)}</span>
                <span class="breakdown-points ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✔ +100 PTS (CORRECTO)' : '✘ 0 PTS (FALLIDO)'}
                </span>
            </div>

            <div class="breakdown-challenge-title">
                Reto ${idx + 1}: ${escapeHTML(challenge.title)}
            </div>

            <div class="breakdown-body">
                <div><strong>Enunciado:</strong> ${escapeHTML(challenge.prompt)}</div>
                <div class="selected-answer">
                    <strong>Opción Seleccionada por el Alumno (${letterChosen}):</strong> ${selectedOption ? escapeHTML(selectedOption.text) : 'Respuesta no registrada'}
                </div>
                ${!isCorrect ? `
                <div style="color: #6ee7b7; font-size: 0.85rem; margin-top: 2px;">
                    <strong>Opción Correcta (${letterCorrect}):</strong> ${escapeHTML(correctOption.text)}
                </div>` : ''}
                <div class="breakdown-explanation">
                    <strong>Dictamen Técnico:</strong> ${escapeHTML(correctOption.feedback)}
                </div>
            </div>
        `;

        list.appendChild(item);
    });
}

    function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
    }
    const mathPow = Math.pow;
    const maxWord = mathPow(2, 32);
    let i, j;
    let result = '';
    const words = [];
    const asciiBitLength = ascii.length * 8;
    let hash = [];
    let k = [];
    let primeCounter = 0;
    const isPrime = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isPrime[candidate]) {
            for (i = candidate * 2; i <= 311; i += candidate) { isPrime[i] = true; }
            if (primeCounter < 8) hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
            k[primeCounter] = (mathPow(candidate, 1/3) * maxWord) | 0;
            primeCounter++;
        }
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
        j = ascii.charCodeAt(i);
        words[i >> 2] |= j << ((3 - i % 4) * 8);
    }
    words[words.length] = ((asciiBitLength / maxWord) | 0);
    words[words.length] = (asciiBitLength | 0);
    for (j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
            const w15 = w[i - 15], w2 = w[i - 2];
            const s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
            const s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
            const ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
            const temp1 = (hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (
                w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0
            )) | 0;
            const maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
            const temp2 = ((rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj) | 0;
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
            const b = (hash[i] >> (j * 8)) & 255;
            result += ((b < 16) ? '0' : '') + b.toString(16);
        }
    }
    return result.toUpperCase();
}

async function computeSHA256(message) {
    if (window.crypto && window.crypto.subtle) {
        try {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        } catch (e) {}
    }
    return sha256Pure(message);
}

// 3. INFALLIBLE PRNG & SHUFFLER
// ==========================================
function createPRNG(seed) {
    let s = (Math.abs(Math.floor(seed)) || 123456789) >>> 0;
    return function() {
        s |= 0;
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function shuffleOptions(array, rng) {
    const copy = array.map((item, originalIndex) => ({ ...item, originalIndex }));
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function escapeHTML(str) {
    if (!str) return '';
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function auditSubmission() {
    sound.playClick();

    const name = document.getElementById('prof-student-name').value.trim().toUpperCase();
    const dni = document.getElementById('prof-student-dni').value.trim().toUpperCase();
    const rawCvhc = document.getElementById('prof-cvhc-code').value.trim();

    if (!name || !dni || !rawCvhc) {
        const errorPanel = document.getElementById('audit-error');
        errorPanel.textContent = 'Por favor, introduce el nombre, DNI y el código CVHC completo.';
        errorPanel.hidden = false;
        document.getElementById('diagnostic-panel').style.display = 'none';
        return;
    }

    // Parsing CVHC
    // Format: AMZ-Q5-2026-S[Seed]-P[Score]-T[Time]-R[Answers]-[Hash]
    // Or without R: AMZ-Q5-2026-S[Seed]-P[Score]-T[Time]-[Hash]
    const cvhcRegex = /^AMZ-Q5-2026-S(\d+)-P(\d+)-T(\d+)(?:-R([0-9A-Za-z]+))?-([0-9A-Fa-f]{8,64})$/i;
    const match = rawCvhc.match(cvhcRegex);

    const diagnosticPanel = document.getElementById('diagnostic-panel');
    const statusBox = document.getElementById('status-badge-box');
    const statusIcon = document.getElementById('status-icon');
    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');

    if (!match) {
        sound.playAlarm();
        diagnosticPanel.style.display = 'block';
        statusBox.className = 'status-badge-box invalid';
        statusIcon.textContent = '❌';
        statusTitle.textContent = 'FORMATO DE CÓDIGO CVHC INVÁLIDO O CORRUPTO';
        statusDesc.textContent = 'La estructura del código no se ajusta al estándar oficial (AMZ-Q5-2026-S[Seed]-P[Score]-T[Time]-R[Answers]-[Hash]). Verifica si faltan guiones o si se han modificado caracteres.';
        
        document.getElementById('audit-string-base').textContent = 'N/A';
        document.getElementById('audit-recalc-hash').textContent = 'N/A';
        document.getElementById('audit-delivered-hash').textContent = rawCvhc;
        document.getElementById('audit-forensic-report').textContent = 'RECHAZADO: Expresión regular no coincidente.';
        document.getElementById('audit-advance-key').textContent = 'BLOQUEADA (Formato inválido)';
        document.getElementById('audit-advance-key').style.color = 'var(--red)';
        ['diag-score', 'diag-grade', 'diag-mitigation', 'diag-time', 'diag-seed'].forEach(id => {
            document.getElementById(id).textContent = '---';
        });
        document.getElementById('breakdown-seed-indicator').textContent = 'Semilla: ---';
        document.getElementById('audit-breakdown-list').innerHTML = '';
        diagnosticPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
    }

    const seed = parseInt(match[1], 10);
    const score = parseInt(match[2], 10);
    const timeInSeconds = parseInt(match[3], 10);
    const answersEncoded = match[4] || '';
    const deliveredHash = match[5].toUpperCase();

    // Reconstruct Expected String Base
    const stringBase = `${name}|${dni}|${seed}|${score}|${timeInSeconds}|${SECRET_KEY}`;
    const fullRecalcHash = await computeSHA256(stringBase);
    const shortRecalcHash = fullRecalcHash.substring(0, 8);

    // Validate Signature
    const isValid = deliveredHash === shortRecalcHash || deliveredHash === fullRecalcHash;

    diagnosticPanel.style.display = 'block';

    if (isValid) {
        sound.playSuccess();
        statusBox.className = 'status-badge-box valid';
        statusIcon.textContent = '✅';
        statusTitle.textContent = 'CÓDIGO VÁLIDO Y AUTÉNTICO (FIRMA CERTIFICADA)';
        statusDesc.textContent = `La firma criptográfica SHA-256 coincide con la clave de seguridad docente. Se confirma que el estudiante ${name} (${dni}) completó la partida con la puntuación y tiempo auditados sin adulteración.`;
    } else {
        sound.playAlarm();
        statusBox.className = 'status-badge-box invalid';
        statusIcon.textContent = '❌';
        statusTitle.textContent = 'CÓDIGO INCOMPATIBLE O MANIPULADO (FIRMA INVÁLIDA)';
        statusDesc.textContent = `ALERTA DE SEGURIDAD DOCENTE: La firma SHA-256 recalculada (${shortRecalcHash}) NO coincide con la firma entregada (${deliveredHash}). El código ha sido adulterado (posible alteración de puntuación, tiempo, nombre o DNI).`;
    }

    // Populate Metrics HUD
    document.getElementById('diag-score').innerHTML = `${score} <span class="sub">/ 1000 pts</span>`;
    document.getElementById('diag-grade').innerHTML = `${(score / 100).toFixed(1)} <span class="sub">/ 10.0</span>`;
    const reduction = ((score / 1000) * 97.6).toFixed(1);
    document.getElementById('diag-mitigation').innerHTML = `${reduction}% <span class="sub">recuperado</span>`;
    
    const mins = Math.floor(timeInSeconds / 60);
    const secs = timeInSeconds % 60;
    document.getElementById('diag-time').innerHTML = `${mins}m ${secs.toString().padStart(2, '0')}s`;
    document.getElementById('diag-seed').textContent = `#${seed}`;

    // Populate Hash Card
    document.getElementById('audit-string-base').textContent = stringBase.slice(0, stringBase.lastIndexOf('|') + 1) + '[FIRMA INTERNA]';
    document.getElementById('audit-recalc-hash').textContent = `${fullRecalcHash} (Firma Corta: ${shortRecalcHash})`;
    document.getElementById('audit-delivered-hash').textContent = deliveredHash;
    document.getElementById('audit-forensic-report').textContent = isValid ? 
        'INTEGRIDAD TOTAL: Hash digest verificado satisfactoriamente.' : 
        'DISCREPANCIA CRIPTOGRÁFICA: Posible intento de manipulación no autorizada.';

    const auditAdvanceKey = document.getElementById('audit-advance-key');
    auditAdvanceKey.textContent = isValid ? ADVANCE_KEY : 'BLOQUEADA (Firma inválida)';
    auditAdvanceKey.style.color = isValid ? 'var(--green)' : 'var(--red)';

    // Populate Forensic 10 Challenges Breakdown
    document.getElementById('breakdown-seed-indicator').textContent = `Semilla Reconstruida: #${seed}`;
    reconstructChallengesAudit(seed, answersEncoded, score);

    diagnosticPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function reconstructChallengesAudit(seed, answersEncoded, claimedScore) {
    const list = document.getElementById('audit-breakdown-list');
    list.innerHTML = '';

    const answersArray = answersEncoded ? answersEncoded.split('').map(c => parseInt(c, 10)) : [];

    CHALLENGES.forEach((challenge, idx) => {
        // Deterministic PRNG with student seed
        const challengeRng = createPRNG(seed + idx * 101);
        const shuffled = shuffleOptions(challenge.options, challengeRng);

        // Find correct option index in shuffled
        const correctIndex = shuffled.findIndex(opt => opt.correct);
        const correctOption = shuffled[correctIndex];

        // Did student provide answer for this?
        let studentSelectedIndex = -1;
        let isCorrect = false;
        let selectedOption = null;

        if (answersArray.length > idx && !isNaN(answersArray[idx])) {
            studentSelectedIndex = answersArray[idx];
            if (studentSelectedIndex >= 0 && studentSelectedIndex < shuffled.length) {
                selectedOption = shuffled[studentSelectedIndex];
                isCorrect = selectedOption.correct;
            }
        } else {
            // If answer string was not provided in CVHC, mark based on challenge accuracy
            isCorrect = (idx < Math.round(claimedScore / 100));
            selectedOption = isCorrect ? correctOption : shuffled.find(opt => !opt.correct);
        }

        const letters = ['A', 'B', 'C', 'D'];
        const letterChosen = studentSelectedIndex >= 0 ? (letters[studentSelectedIndex] || studentSelectedIndex + 1) : '-';
        const letterCorrect = letters[correctIndex] || (correctIndex + 1);

        const item = document.createElement('div');
        item.className = `breakdown-item ${isCorrect ? 'correct' : 'incorrect'}`;

        item.innerHTML = `
            <div class="breakdown-header">
                <span class="breakdown-ra">${escapeHTML(challenge.ra)}</span>
                <span class="breakdown-points ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✔ +100 PTS (CORRECTO)' : '✘ 0 PTS (FALLIDO)'}
                </span>
            </div>

            <div class="breakdown-challenge-title">
                Reto ${idx + 1}: ${escapeHTML(challenge.title)}
            </div>

            <div class="breakdown-body">
                <div><strong>Enunciado:</strong> ${escapeHTML(challenge.prompt)}</div>
                <div class="selected-answer">
                    <strong>Opción Seleccionada por el Alumno (${letterChosen}):</strong> ${selectedOption ? escapeHTML(selectedOption.text) : 'Respuesta no registrada'}
                </div>
                ${!isCorrect ? `
                <div style="color: #6ee7b7; font-size: 0.85rem; margin-top: 2px;">
                    <strong>Opción Correcta (${letterCorrect}):</strong> ${escapeHTML(correctOption.text)}
                </div>` : ''}
                <div class="breakdown-explanation">
                    <strong>Dictamen Técnico:</strong> ${escapeHTML(correctOption.feedback)}
                </div>
            </div>
        `;

        list.appendChild(item);
    });
}

async function loadSampleTest(score, time) {
    const name = "CARLOS GARCIA";
    const dni = "48765432X";
    const seed = 9182;

    document.getElementById('prof-student-name').value = name;
    document.getElementById('prof-student-dni').value = dni;

    // Simulate answer pattern based on score
    // 1000 = 10 correct answers
    // 800 = 8 correct, 2 incorrect
    let answersArr = [];
    for (let i = 0; i < 10; i++) {
        const rng = createPRNG(seed + i * 101);
        const shuffled = shuffleOptions(CHALLENGES[i].options, rng);
        const correctIdx = shuffled.findIndex(o => o.correct);
        const wrongIdx = shuffled.findIndex(o => !o.correct);

        if (score === 1000) {
            answersArr.push(correctIdx);
        } else if (score === 800) {
            // retos 3 y 7 fallados
            if (i === 2 || i === 6) {
                answersArr.push(wrongIdx);
            } else {
                answersArr.push(correctIdx);
            }
        }
    }

    const answersStr = answersArr.join('');
    const stringBase = `${name}|${dni}|${seed}|${score}|${time}|${SECRET_KEY}`;
    const hash = await computeSHA256(stringBase);
    const shortHash = hash.substring(0, 8);

    const cvhc = `AMZ-Q5-2026-S${seed}-P${score}-T${time}-R${answersStr}-${shortHash}`;
    document.getElementById('prof-cvhc-code').value = cvhc;

    await auditSubmission();
}

async function loadTamperedSample() {
    const name = "ANA BELEN MARTINEZ";
    const dni = "23456789W";
    const seed = 5510;
    const realScore = 400; // Real score was 400
    const forgedScore = 1000; // Tampered in CVHC to claim 1000!
    const time = 310;

    document.getElementById('prof-student-name').value = name;
    document.getElementById('prof-student-dni').value = dni;

    // Compute hash with REAL score 400
    const stringBase = `${name}|${dni}|${seed}|${realScore}|${time}|${SECRET_KEY}`;
    const hash = await computeSHA256(stringBase);
    const shortHash = hash.substring(0, 8);

    // Tampered CVHC: declares P1000 but signature belongs to P400!
    const tamperedCvhc = `AMZ-Q5-2026-S${seed}-P${forgedScore}-T${time}-R0123012301-${shortHash}`;
    document.getElementById('prof-cvhc-code').value = tamperedCvhc;

    await auditSubmission();
}

function resetForm() {
    ['prof-student-name', 'prof-student-dni', 'prof-cvhc-code'].forEach(id => {
        document.getElementById(id).value = '';
    });
    document.getElementById('diagnostic-panel').style.display = 'none';
    document.getElementById('audit-error').hidden = true;
    sound.playClick();
}

async function runAuditAction(action) {
    const errorPanel = document.getElementById('audit-error');
    const buttons = document.querySelectorAll('#form-audit button');
    errorPanel.hidden = true;
    buttons.forEach(button => { button.disabled = true; });
    try {
        await action();
    } catch (error) {
        console.error('Error al verificar la partida:', error);
        document.getElementById('diagnostic-panel').style.display = 'none';
        errorPanel.textContent = 'No se pudo completar la comprobación. Revisa los datos e inténtalo de nuevo.';
        errorPanel.hidden = false;
    } finally {
        buttons.forEach(button => { button.disabled = false; });
    }
}

document.getElementById('btn-verify').addEventListener('click', () => runAuditAction(auditSubmission));
root.querySelector('[data-action="action-0"]').addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
        event.preventDefault();
        if (!document.getElementById('btn-verify').disabled) runAuditAction(auditSubmission);
    }
});
root.querySelector('[data-action="action-1"]').addEventListener('click', () => runAuditAction(() => loadSampleTest(1000, 185)));
root.querySelector('[data-action="action-2"]').addEventListener('click', () => runAuditAction(() => loadSampleTest(800, 240)));
root.querySelector('[data-action="action-3"]').addEventListener('click', () => runAuditAction(loadTamperedSample));
root.querySelector('[data-action="action-4"]').addEventListener('click', (event) => { resetForm() });
